    <script src="tyrano/libs/howler.js"></script>
    <script src="data/system/KeyConfig.js"></script>
    
    <script src="tyrano/plugins/kag/kag.js"></script>

<body onselectstart="return false">
    <div id="tyrano_base" class="tyrano_base"></div>
    <script>
        $(function(){
            // 無理やり数秒待ってからエンジンを動かす
            setTimeout(function(){
                if(typeof TYRANO !== 'undefined'){
                    TYRANO.kag.init();
                } else {
                    document.body.innerHTML = "<h1>エンジン読み込み失敗</h1><p>tyranoフォルダへのアクセスが拒否されているか、ファイルが存在しません。</p>";
                }
            }, 2000);
        });
    </script>
</body>
